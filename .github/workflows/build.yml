name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade -r requirements.txt pyinstaller
          python tools/make_icon.py
          python tools/make_version_file.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MagnifySnap --icon assets/icon.ico --version-file assets/version_info.txt --collect-all customtkinter main.py
      - name: Antivirus check (best effort — see note)
        shell: pwsh
        run: |
          # ВАЖНО: на GitHub-раннерах рабочая папка исключена из проверки
          # Defender, поэтому скан обычно рапортует "was skipped". Такой
          # результат НЕЛЬЗЯ считать чистым — настоящий барьер это
          # tools/av_check.py на машине с боевым Defender перед релизом.
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $exe = (Resolve-Path dist/MagnifySnap.exe).Path
          if (-not (Test-Path $mp)) {
            Write-Host "::warning::Defender unavailable on runner — build NOT scanned"
            exit 0
          }
          $out = (& $mp -Scan -ScanType 3 -File $exe) -join "`n"
          Write-Host $out
          if ($out -match 'found no threats') {
            Write-Host "Defender scan clean"
          } elseif ($out -match 'was skipped' -or -not (Test-Path $exe)) {
            if (-not (Test-Path $exe)) { throw "Binary disappeared during scan — Defender removed it" }
            Write-Host "::warning::Runner excludes the workspace — binary NOT scanned here. Run tools/av_check.py before publishing."
          } else {
            throw "Windows Defender reported a threat — refusing to publish"
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # winget ставит "портативный" тип без ярлыков — GUI-приложение
          # после установки невозможно запустить, поэтому нужен установщик
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          $ver = (Select-String -Path fast_magnifier/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Building installer for $ver"
          & $iscc "/DMyVersion=$ver" installer\magnifysnap.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-ChildItem dist -Filter *setup*.exe | ForEach-Object {
            Move-Item $_.FullName dist/MagnifySnap-windows-x64-setup.exe -Force
          }
      - name: Package
        run: Move-Item dist/MagnifySnap.exe dist/MagnifySnap-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MagnifySnap-windows-x64
          path: |
            dist/MagnifySnap-windows-x64.exe
            dist/MagnifySnap-windows-x64-setup.exe

  linux:
    # старый Ubuntu = совместимость с большим числом дистрибутивов (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Build
        run: |
          python -m pip install --upgrade -r requirements.txt pyinstaller
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name magnifysnap --collect-all customtkinter main.py
      - name: Package (tar.gz preserves the executable bit)
        run: |
          chmod +x dist/magnifysnap
          tar -czf dist/MagnifySnap-linux-x64.tar.gz -C dist magnifysnap
      - uses: actions/upload-artifact@v4
        with:
          name: MagnifySnap-linux-x64
          path: dist/MagnifySnap-linux-x64.tar.gz
